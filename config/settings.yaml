# 全局运行配置（骨架值来自 PLAN.md §5.1；budget 参数待 T3.3 按实测基线校准）

provider:
  primary: gemini              # 主供应商（配置了对应 Key 的即可用）
  fallback: anthropic-compat   # 主供应商退避穷尽后自动切换
  gemini:
    # 模型名以官方文档当前稳定版为准
    model: gemini-flash-latest
    rpm: 10                    # 主动限速（次/分钟）：按免费层配额保守设置
  anthropic-compat:            # Anthropic 协议兼容端点：MiniMax / Anthropic 官方等
    model: MiniMax-M3
    base_url: https://api.minimax.cn/anthropic
    api_key_env: MINIMAX_API_KEY
    max_tokens: 16384          # M3 为思考型模型，输出含思考 token，需留余量
    rpm: 30                    # 主动限速（次/分钟），按实际配额调整
  openai-compat:               # OpenAI 协议端点：OpenAI / DeepSeek / OpenRouter / Ollama 等
    model: deepseek-chat       # 亦可为 OpenRouter 免费模型或本地 Ollama 模型
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    response_format: json_schema  # 端点不支持时改 json_object 或 none（纯 Prompt 约束）

# 日预算熔断（任务数 / Token 数双上限，超限当日停止派发新任务）
# 按 T1.5/T1.6 实测基线校准：单任务 input 0.7万~2.8万（chars/4 估算）、output ~240
budget:
  max_tasks_per_day: 300
  max_input_tokens_per_day: 3000000

# 守护进程 tick 扫描周期（秒）：sources 表的配置变更在此周期内生效
scheduler:
  tick_s: 30

alerts:
  macos_notify: false          # BLOCKED / 认证失败时发 macOS 本地通知

fetch:
  min_interval_per_host_s: 5   # 同一域名两次请求的最小间隔
  respect_robots: true
  # 上线前改为真实联系方式
  user_agent: "DataCollectorBot/0.1 (personal research; contact: you@example.com)"

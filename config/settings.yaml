# 全局运行配置（骨架值来自 PLAN.md §5.1；budget 参数待 T3.3 按实测基线校准）

provider:
  # pi-ai 供应商目录的通道名（minimax-cn / anthropic / google / openai / minimax）
  primary: minimax-cn
  fallback: google
  minimax-cn:
    model: MiniMax-M3
    rpm: 30                    # 主动限速（次/分钟），按实际配额调整
  google:
    model: gemini-flash-latest # 以 pi-ai 目录当前可用模型为准
    rpm: 10                    # 免费层量级，保守设置

# 日预算熔断（任务数 / Token 数双上限，超限当日停止派发新任务）
# 按 T1.5/T1.6 实测基线校准：单任务 input 0.7万~2.8万（chars/4 估算）、output ~240
budget:
  max_tasks_per_day: 300
  max_input_tokens_per_day: 3000000

# 守护进程 tick 扫描周期（秒）：sources 表的配置变更在此周期内生效
scheduler:
  tick_s: 30

alerts:
  macos_notify: false          # BLOCKED / 认证失败时发 macOS 本地通知

fetch:
  min_interval_per_host_s: 5   # 同一域名两次请求的最小间隔
  respect_robots: true
  # 上线前改为真实联系方式
  user_agent: "DataCollectorBot/0.1 (personal research; contact: you@example.com)"

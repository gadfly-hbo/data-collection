# 采集来源白名单（对应 SQLite sources 表；schema_type 对应 models/registry.py 注册的类名）
sources:
  - name: HackerNews
    url: https://news.ycombinator.com
    schema_type: NewsItem      # 聚合列表页：按设计记 SKIPPED_NO_CONTENT，0 次 LLM 调用
    interval_s: 3600
    enabled: true
    instruction: ""
  - name: Wikipedia-WebScraping
    url: https://en.wikipedia.org/wiki/Web_scraping
    schema_type: NewsItem
    interval_s: 7200
    enabled: true
    instruction: ""
    # use_browser: true         # 强 JS 渲染站点开启浏览器路径（需安装 playwright 驱动）
